[package]
name = "easyeda-to-kicad-converter"
version = "2.1.0"
description = "Converts EasyEDA and LCSC parts to KiCad symbols, footprints, and 3D models"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "easyeda_to_kicad_converter"

[[bin]]
name = "easyeda-to-kicad-converter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Devtools stay out of release builds: the `devtools` feature is never on,
# and Tauri only includes them in debug builds without it.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows' own TLS stack and certificate store, so a network that adds its
# own root certificate works the way it does in the browser.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["sync", "rt"] }
flate2 = "1"
regex = "1"
# The symbol library patterns need backreferences and lookahead.
fancy-regex = "0.16"
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
